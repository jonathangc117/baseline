<div class="singles-matches flex flex-column gap-2">
  <div class="header flex flex-row justify-content-between align-items-center">
    <h2>Singles Matches</h2>
    <button pButton type="button" label="Add Match" (click)="addMatch()"></button>
  </div>

  <div class="flex gap-2 align-items-center">
    <input pInputText type="text" placeholder="Search..." [(ngModel)]="search" />
    <button pButton type="button" label="Search" (click)="onSearchChange()"></button>
  </div>

  <p-table [value]="matches" [loading]="loading" [paginator]="true" [rows]="pageSize" [totalRecords]="total" [lazy]="true" (onPage)="onPage($event)">
    <ng-template pTemplate="header">
      <tr>
        <th>Date</th>
        <th>Player 1</th>
        <th>Player 2</th>
        <th>Score</th>
        <!-- <th>Surface</th> -->
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-match>
      <tr (click)="onMatchClick(match.id)">
        <td>{{ match.date | date:'yyyy-MM-dd' }}</td>
        <td>{{ match.player1_player?.name || match.player1_name }}</td>
        <td>{{ match.player2_player?.name || match.player2_name }}</td>
        <td>{{ match.score }}</td>
        <!-- <td>
          <p-tag [value]="match.surface | titlecase"></p-tag>
        </td> -->
      </tr>
    </ng-template>
  </p-table>
</div>
