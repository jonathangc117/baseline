<div *ngIf="loading">Loading...</div>

<p-card *ngIf="!loading && player" header="Player">
  <div class="flex align-items-center gap-3">
    <p-avatar [label]="player.name?.[0] || '?'" shape="circle"></p-avatar>
    <div class="flex flex-column">
      <div class="text-lg font-bold">{{ player.name }}</div>
      <div class="text-sm">{{ player.email }}</div>
    </div>
  </div>
  <div class="mt-3 flex gap-2">
    <p-tag value="Wins: {{ player.wins || 0 }}"></p-tag>
    <p-tag value="Losses: {{ player.losses || 0 }}" severity="danger"></p-tag>
  </div>
</p-card>

<p-message *ngIf="error" severity="error" [text]="error"></p-message>
