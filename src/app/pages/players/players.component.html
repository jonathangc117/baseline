<div class="players-container">
  <div class="players-header">
    <h1>Tennis Players</h1>
  </div>

  <div *ngIf="loading" class="loading-container">
    <p>Loading players...</p>
  </div>

  <div *ngIf="error" class="error-container">
    <p class="error-message">{{ error }}</p>
    <p-button
      label="Retry"
      icon="pi pi-refresh"
      (onClick)="loadPlayers()">
    </p-button>
  </div>

  <div *ngIf="!loading && !error">
    <p-table [value]="players" [paginator]="true" [rows]="10">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-player>
        <tr>
          <td>{{ player.name }}</td>
          <td>{{ player.email }}</td>
          <td>
            <button pButton type="button" label="View" class="p-button-text" (click)="onPlayerClick(player.id)"></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
